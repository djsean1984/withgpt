name: WeRead weekly sync

on:
  workflow_dispatch:
  schedule:
    # Every Monday at 04:00 UTC (about 06:00 in France during summer, 05:00 during winter)
    - cron: '0 4 * * 1'

jobs:
  sync:
    name: Sync WeRead to Notion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: WeRead to Notion
        uses: ./
        with:
          weread-api-key: ${{ secrets.WEREAD_API_KEY }}
          notion-token: ${{ secrets.NOTION_TOKEN }}
          notion-data-source-id: 2899b420-d71e-4701-b176-367b30ae695c
          diary-data-source-id: 1c160da0-faa8-800d-8918-000b97b6c320
